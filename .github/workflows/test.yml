name: tests

on:
  push:
    branches: ["19.0"]
  pull_request:
    branches: ["19.0"]

env:
  ODOO_VERSION: "19.0"
  MODULES: "stock_count,stock_count_cycle"

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install pre-commit
      - run: pre-commit run --all-files --show-diff-on-failure

  test:
    runs-on: ubuntu-latest
    needs: lint
    services:
      db:
        image: postgres:15
        env:
          POSTGRES_USER: odoo
          POSTGRES_PASSWORD: odoo
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Install and test modules inside the official Odoo image
        run: |
          set -o pipefail
          # Chrome y websocket-client: sin ellos Odoo saltea las pruebas de navegador (tours)
          docker run --rm --network host --user root --entrypoint bash \
            -v "$PWD:/mnt/extra-addons:ro" \
            odoo:${ODOO_VERSION} -c "
              set -e
              apt-get update -qq
              apt-get install -y -qq --no-install-recommends wget python3-websocket > /dev/null
              wget -q -O /tmp/chrome.deb https://dl.google.com/linux/direct/google-chrome-stable_current_amd64.deb
              apt-get install -y -qq /tmp/chrome.deb > /dev/null
              runuser -u odoo -- odoo -d test_odoo_stock_count \
                --db_host=localhost --db_user=odoo --db_password=odoo \
                --addons-path=/mnt/extra-addons,/usr/lib/python3/dist-packages/odoo/addons \
                -i ${MODULES} --test-enable --test-tags '/stock_count,/stock_count_cycle' \
                --stop-after-init --log-level=test
            " 2>&1 | tee odoo-test.log
          ! grep -E "^.* (ERROR|CRITICAL) " odoo-test.log
